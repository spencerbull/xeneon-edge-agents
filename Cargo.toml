[workspace]
members = [
  "crates/xeneon-agent-core",
  "crates/xeneon-agentctl",
  "crates/xeneon-agentd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks"] }
tempfile = "3.24.0"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.49.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v5"] }

[profile.release]
lto = "thin"
strip = "symbols"
