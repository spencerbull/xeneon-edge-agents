name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source:
    name: Source gates (Arch Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: archlinux:base-devel@sha256:40d14ac9db5af04f695eacd82a53181ad685fecc2534a66e05a51182a077cbd5

    steps:
      - name: Install Arch Linux test dependencies
        run: >-
          pacman --noconfirm --needed -Syu
          git
          just
          lua
          python
          qt6-declarative
          quickshell
          rust
          shellcheck

      - name: Add Qt 6 tools to PATH
        run: echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify the Rust toolchain
        id: toolchain
        run: |
          rust_hash=$(rustc --version --verbose | sha256sum | cut -d ' ' -f 1)
          echo "rust-hash=$rust_hash" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: arch-cargo-${{ runner.arch }}-${{ steps.toolchain.outputs.rust-hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            arch-cargo-${{ runner.arch }}-${{ steps.toolchain.outputs.rust-hash }}-

      - name: Check shell sources
        run: |
          # lib.sh intentionally exports shared paths to its callers, and the
          # preview signal callback is referenced indirectly by trap.
          shell_roots=(scripts tests)
          [[ ! -d packaging/arch ]] || shell_roots+=(packaging/arch)
          shell_sources=()
          while IFS= read -r -d '' source; do
            if [[ "$source" == *.sh ]] ||
              head -n 1 -- "$source" | grep -Eq '^#!.*(bash|/sh)([[:space:]]|$)'; then
              shell_sources+=("$source")
            fi
          done < <(find "${shell_roots[@]}" -type f -print0 | sort -z)
          ((${#shell_sources[@]} > 0))
          shellcheck --exclude SC1003,SC2034,SC2329 "${shell_sources[@]}"

      - name: Run the complete source verification ladder
        run: just check
