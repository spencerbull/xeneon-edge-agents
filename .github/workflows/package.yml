name: Arch package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release-source:
    name: Verify source before tag release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build unpublished package
    needs: release-source
    if: >-
      always() &&
      (needs.release-source.result == 'success' ||
      needs.release-source.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:base-devel@sha256:40d14ac9db5af04f695eacd82a53181ad685fecc2534a66e05a51182a077cbd5

    steps:
      - name: Install trusted package build tools
        run: |
          # Update this trusted allowlist if PKGBUILD makedepends changes.
          pacman --noconfirm --needed -Syu git jq namcap rust

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the Arch packaging definition
        run: |
          test -f packaging/arch/PKGBUILD || {
            echo "::error::packaging/arch/PKGBUILD is required before this workflow can build"
            exit 1
          }

      - name: Prepare an unprivileged package builder
        run: |
          useradd --create-home --shell /bin/bash builder
          chown --recursive --no-dereference \
            builder:builder "$GITHUB_WORKSPACE" /home/builder

      - name: Read package metadata
        id: package
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          srcinfo=$(
            runuser -u builder -- env -i \
              HOME=/home/builder \
              LANG=C.UTF-8 \
              LOGNAME=builder \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin \
              USER=builder \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              bash -s <<'METADATA'
            cd "$GITHUB_WORKSPACE/packaging/arch"
            makepkg --printsrcinfo
          METADATA
          )
          pkgver=$(awk '$1 == "pkgver" { print $3; exit }' <<< "$srcinfo")
          pkgrel=$(awk '$1 == "pkgrel" { print $3; exit }' <<< "$srcinfo")
          epoch=$(awk '$1 == "epoch" { print $3; exit }' <<< "$srcinfo")
          test -n "$pkgver" && test -n "$pkgrel" || {
            echo "::error::PKGBUILD did not expose pkgver and pkgrel"
            exit 1
          }

          cargo_version=$(
            runuser -u builder -- env -i \
              HOME=/home/builder \
              LANG=C.UTF-8 \
              LOGNAME=builder \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin \
              USER=builder \
              cargo metadata \
                --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
                --no-deps \
                --format-version 1 \
              | jq -er '
                  .workspace_members as $members
                  | [
                      .packages[]
                      | select(.id as $id | $members | index($id))
                      | .version
                    ]
                  | unique
                  | if length == 1 then
                      .[0]
                    else
                      error("workspace packages do not share one version")
                    end
                '
          )
          if [[ "$pkgver" != "$cargo_version" ]]; then
            echo "::error::PKGBUILD version $pkgver does not match Cargo version $cargo_version"
            exit 1
          fi
          archive_version="$pkgver-$pkgrel"
          if [[ -n "$epoch" ]]; then
            archive_version="$epoch:$archive_version"
          fi

          if [[ "$IS_TAG" == true ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$cargo_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match source version v$cargo_version"
              exit 1
            fi
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
            runuser -u builder -- env -i \
              HOME=/home/builder \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin \
              git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet "$default_ref" || {
              echo "::error::default branch ref $default_ref is unavailable"
              exit 1
            }
            runuser -u builder -- env -i \
              HOME=/home/builder \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin \
              git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
                "$GITHUB_SHA" "$default_ref" || {
              echo "::error::tag commit is not contained in $DEFAULT_BRANCH"
              exit 1
            }
          fi

          echo "version=$pkgver" >> "$GITHUB_OUTPUT"
          echo "archive-version=$archive_version" >> "$GITHUB_OUTPUT"

      - name: Build binary and source packages
        env:
          EXPECTED_ARCHIVE_VERSION: ${{ steps.package.outputs.archive-version }}
        run: |
          runuser -u builder -- env -i \
              HOME=/home/builder \
              LANG=C.UTF-8 \
              LOGNAME=builder \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin \
              USER=builder \
              EXPECTED_ARCHIVE_VERSION="$EXPECTED_ARCHIVE_VERSION" \
              GITHUB_SHA="$GITHUB_SHA" \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -s <<'BUILDER'
              set -euo pipefail
              cd "$GITHUB_WORKSPACE"
              packaging/arch/build-local-package --nodeps "$GITHUB_SHA"
              output_dir=$GITHUB_WORKSPACE/packaging/arch/dist

              mapfile -t package_files < <(
                find "$output_dir" -maxdepth 1 -type f \
                  -name "*.pkg.tar.*" ! -name "*.sig" -print | sort
              )
              ((${#package_files[@]} == 1))
              pkginfo=$(bsdtar -xOf "${package_files[0]}" .PKGINFO)
              archive_name=$(awk '$1 == "pkgname" { print $3; exit }' <<< "$pkginfo")
              archive_version=$(awk '$1 == "pkgver" { print $3; exit }' <<< "$pkginfo")
              archive_arch=$(awk '$1 == "arch" { print $3; exit }' <<< "$pkginfo")
              if [[ "$archive_name" != xeneon-edge-agents ||
                "$archive_version" != "$EXPECTED_ARCHIVE_VERSION" ||
                "$archive_arch" != x86_64 ]]; then
                printf "error: unexpected package identity: %s %s %s\n" \
                  "$archive_name" "$archive_version" "$archive_arch" >&2
                exit 1
              fi

              namcap packaging/arch/PKGBUILD "${package_files[@]}" \
                > "$output_dir/namcap.txt" 2>&1
              if grep -Eq "(^|[[:space:]])E:" "$output_dir/namcap.txt"; then
                cat "$output_dir/namcap.txt" >&2
                exit 1
              fi
          BUILDER

      - name: Collect packages and checksums
        id: collect
        env:
          EXPECTED_ARCHIVE_VERSION: ${{ steps.package.outputs.archive-version }}
        run: |
          package_output=packaging/arch/dist
          mapfile -t binary_packages < <(
            find "$package_output" -maxdepth 1 -type f \
              -name '*.pkg.tar.*' ! -name '*.sig' \
              -print | sort
          )
          mapfile -t source_packages < <(
            find "$package_output" -maxdepth 1 -type f \
              -name '*.src.tar.*' ! -name '*.sig' \
              -print | sort
          )
          ((${#binary_packages[@]} == 1)) || {
            echo "::error::package helper must produce exactly one binary package"
            exit 1
          }
          ((${#source_packages[@]} == 1)) || {
            echo "::error::package helper must produce exactly one source package"
            exit 1
          }

          staging_dir=$(mktemp -d "$RUNNER_TEMP/xeneon-package.XXXXXX")
          chmod 0700 "$staging_dir"
          echo "dist=$staging_dir" >> "$GITHUB_OUTPUT"
          cp -- "${binary_packages[0]}" "${source_packages[0]}" "$staging_dir/"
          [[ -f "$package_output/.SRCINFO" && ! -L "$package_output/.SRCINFO" ]]
          [[ -f "$package_output/namcap.txt" && ! -L "$package_output/namcap.txt" ]]
          install -m 0644 "$package_output/.SRCINFO" "$staging_dir/.SRCINFO"
          install -m 0644 "$package_output/namcap.txt" "$staging_dir/namcap.txt"

          srcinfo_pkgver=$(
            awk '$1 == "pkgver" { print $3; exit }' "$staging_dir/.SRCINFO"
          )
          srcinfo_pkgrel=$(
            awk '$1 == "pkgrel" { print $3; exit }' "$staging_dir/.SRCINFO"
          )
          srcinfo_epoch=$(
            awk '$1 == "epoch" { print $3; exit }' "$staging_dir/.SRCINFO"
          )
          srcinfo_archive_version="$srcinfo_pkgver-$srcinfo_pkgrel"
          if [[ -n "$srcinfo_epoch" ]]; then
            srcinfo_archive_version="$srcinfo_epoch:$srcinfo_archive_version"
          fi
          [[ "$srcinfo_archive_version" == "$EXPECTED_ARCHIVE_VERSION" ]] || {
            echo "::error::effective .SRCINFO version does not match approved source version"
            exit 1
          }

          declare -A package_entries=()
          while IFS= read -r entry; do
            printf '%s\n' "$entry" >> "$staging_dir/package-files.txt"
            package_entries["$entry"]=1
            case "$entry" in
              .BUILDINFO|.MTREE|.PKGINFO|\
              usr|usr/|usr/bin|usr/bin/|usr/lib|usr/lib/|\
              usr/lib/systemd|usr/lib/systemd/|\
              usr/lib/systemd/user|usr/lib/systemd/user/|\
              usr/share|usr/share/|usr/share/doc|usr/share/doc/|\
              usr/share/licenses|usr/share/licenses/|\
              usr/bin/xeneon-agentd|usr/bin/xeneon-agentctl|\
              usr/bin/xeneon-edge-agents|usr/bin/xeneon-edge-agents-check|\
              usr/bin/xeneon-edge-agents-detect|\
              usr/bin/xeneon-edge-agents-install|\
              usr/bin/xeneon-edge-agents-migrate|\
              usr/bin/xeneon-edge-agents-preview|\
              usr/bin/xeneon-edge-agents-uninstall|\
              usr/lib/systemd/user/xeneon-agentd.service|\
              usr/lib/systemd/user/xeneon-edge-portal.service|\
              usr/lib/xeneon-edge-agents|usr/lib/xeneon-edge-agents/|\
              usr/lib/xeneon-edge-agents/*|\
              usr/share/doc/xeneon-edge-agents|\
              usr/share/doc/xeneon-edge-agents/|\
              usr/share/doc/xeneon-edge-agents/*|\
              usr/share/licenses/xeneon-edge-agents|\
              usr/share/licenses/xeneon-edge-agents/|\
              usr/share/licenses/xeneon-edge-agents/*|\
              usr/share/xeneon-edge-agents|\
              usr/share/xeneon-edge-agents/|\
              usr/share/xeneon-edge-agents/*)
                ;;
              *)
                echo "::error::package archive contains unowned path: $entry"
                exit 1
                ;;
            esac
          done < <(bsdtar -tf "${binary_packages[0]}")

          required_entries=(
            usr/bin/xeneon-agentctl
            usr/bin/xeneon-agentd
            usr/bin/xeneon-edge-agents
            usr/bin/xeneon-edge-agents-check
            usr/bin/xeneon-edge-agents-detect
            usr/bin/xeneon-edge-agents-install
            usr/bin/xeneon-edge-agents-migrate
            usr/bin/xeneon-edge-agents-preview
            usr/bin/xeneon-edge-agents-uninstall
            usr/lib/systemd/user/xeneon-agentd.service
            usr/lib/systemd/user/xeneon-edge-portal.service
            usr/lib/xeneon-edge-agents/xeneon-edge-agents
            usr/lib/xeneon-edge-agents/scripts/launch-package-portal.sh
            usr/share/xeneon-edge-agents/config/xeneon-edge-agents/portal.env.example
            usr/share/xeneon-edge-agents/quickshell/shell.qml
            usr/share/xeneon-edge-agents/schema/portal-v1.schema.json
            usr/share/doc/xeneon-edge-agents/README.md
            usr/share/licenses/xeneon-edge-agents/LICENSE
          )
          for required in "${required_entries[@]}"; do
            [[ -n "${package_entries[$required]+present}" ]] || {
              echo "::error::required package path is missing: /$required"
              exit 1
            }
          done

          smoke_root=$(mktemp -d "$RUNNER_TEMP/xeneon-smoke.XXXXXX")
          chown builder:builder "$smoke_root"
          smoke_package=$(realpath "${binary_packages[0]}")
          runuser -u builder -- env -i \
              HOME=/home/builder \
              LANG=C.UTF-8 \
              LOGNAME=builder \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin \
              USER=builder \
              SMOKE_PACKAGE="$smoke_package" \
              SMOKE_ROOT="$smoke_root" \
            bash -s <<'SMOKE'
              set -euo pipefail
              bsdtar -xf "$SMOKE_PACKAGE" -C "$SMOKE_ROOT"
              "$SMOKE_ROOT/usr/bin/xeneon-agentd" --version
              "$SMOKE_ROOT/usr/bin/xeneon-agentctl" --version
              "$SMOKE_ROOT/usr/bin/xeneon-edge-agents" \
                | grep -Fq 'Usage: xeneon-edge-agents'
          SMOKE

          (
            cd "$staging_dir"
            sha256sum -- \
              .SRCINFO \
              *.pkg.tar.* \
              *.src.tar.* \
              namcap.txt \
              package-files.txt \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
            [[ $(wc -l < SHA256SUMS) == 5 ]]
          )

      - name: Upload private workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xeneon-edge-agents-arch-${{ github.sha }}
          path: ${{ steps.collect.outputs.dist }}/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: 14

  release:
    name: Create private GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # zizmor: ignore[excessive-permissions] Required for private release assets.

    steps:
      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xeneon-edge-agents-arch-${{ github.sha }}
          path: dist

      - name: Verify assets
        run: |
          shopt -s nullglob
          binary_packages=(dist/*.pkg.tar.*)
          source_packages=(dist/*.src.tar.*)
          ((${#binary_packages[@]} == 1))
          ((${#source_packages[@]} == 1))
          test -f dist/.SRCINFO
          test -f dist/SHA256SUMS
          test -f dist/namcap.txt
          test -f dist/package-files.txt
          [[ -z "$(find dist -mindepth 2 -print -quit)" ]]
          [[ $(find dist -maxdepth 1 -type f | wc -l) == 6 ]]
          (
            cd dist
            [[ $(wc -l < SHA256SUMS) == 5 ]]
            mapfile -t manifest_names < <(
              sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | sort
            )
            mapfile -t expected_names < <(
              find . -maxdepth 1 -type f ! -name SHA256SUMS \
                -printf '%f\n' | sort
            )
            [[ "${manifest_names[*]}" == "${expected_names[*]}" ]]
            sha256sum --check SHA256SUMS
          )

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_private_repository() {
            local visibility
            visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')
            if [[ "$visibility" != private ]]; then
              echo "::error::refusing to publish release assets from a non-private repository"
              exit 1
            fi
          }
          verify_tag_target() {
            local remote_sha
            remote_sha=$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
                --jq '.sha'
            )
            if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::tag no longer resolves to the commit that produced these assets"
              exit 1
            fi
          }
          verify_private_repository
          verify_tag_target

          if immutable=$(
            gh api "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq '.enabled' 2>/dev/null
          ); then
            if [[ "$immutable" != true ]]; then
              echo "::warning::repository immutable releases are disabled; workflow reruns still refuse replacement"
            fi
          else
            echo "::warning::could not inspect the repository immutable-release setting"
          fi

          mapfile -d '' assets < <(
            find dist -maxdepth 1 -type f -print0 | sort -z
          )
          ((${#assets[@]} == 6)) || {
            echo "::error::expected packages, checksums, metadata, and audit reports"
            exit 1
          }

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists; this workflow never replaces assets"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --draft \
            --generate-notes \
            --title "XENEON EDGE Agents $GITHUB_REF_NAME" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
          verify_private_repository
          verify_tag_target
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"
